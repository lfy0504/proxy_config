# ============================================================================
#  Clash Meta / Mihomo 完整配置（可直接使用）
# ----------------------------------------------------------------------------
#  设计说明
#   1. 节点不硬编码：节点全部由 proxy-providers 订阅动态导入，
#      各国/地区组用 filter 正则从订阅里实时筛选节点。
#   2. 每个国家组都是 url-test，自动测速并选用延迟最低的节点。
#   3. 「♻️ 自动测速」= 两个订阅的全部节点一起测速，自动使用延迟最低的那台；
#      要手动锁国家用「🐟 漏网之鱼」或各应用组，要锁单台节点用「🎯 手动选节点」。
#   4. AI / Google / 流媒体 / Microsoft / 加密货币 各自独立策略组，
#      组内既能选「♻️ 自动测速」，也能手动指定国家。
#   5. 国内域名 GEOSITE,cn、国内 IP GEOIP,CN 一律 DIRECT；
#      其余国外流量落到「🐟 漏网之鱼」→「♻️ 自动测速」。
#   6. DNS 用 fake-ip + nameserver-policy 分流解析：国内域名用国内 DoH，
#      国外域名用国外加密 DoH，代理服务器域名单独解析，避免 DNS 泄漏。
# ----------------------------------------------------------------------------
#  使用前只需要改 1 个地方：
#      proxy-providers.provider1.url  ->  换成你自己的订阅链接
# ============================================================================

# ----------------------------- 基础设置 -------------------------------------
mixed-port: 7890                 # HTTP / SOCKS5 混合端口
# redir-port: 7891               # Linux 透明代理时打开
# tproxy-port: 7892              # Linux TProxy 时打开
allow-lan: false                 # 需要给局域网其它设备用时改成 true
bind-address: "*"
mode: rule
log-level: info
ipv6: false                      # 有 IPv6 需求时改 true，并把 dns.ipv6 一起打开
unified-delay: true              # 统一测速口径，节点延迟才有可比性
tcp-concurrent: true             # 并发握手，连接建立更快
find-process-mode: strict        # 让 PROCESS-NAME 类规则可用
# 注意：mihomo 1.19 起已移除 global-client-fingerprint，
# 写了会报 “The `global-client-fingerprint` configuration is removed”。
# 需要伪装指纹时，直接写在单个 proxy 的 client-fingerprint 上。
keep-alive-idle: 600
keep-alive-interval: 30

# 控制面板：Clash Verge / Mihomo Party / metacubexd 等
external-controller: 127.0.0.1:9090
secret: ""                       # 需要远程管理时设置密码
# external-ui: ui

# TUN 模式（需要内核接管整机流量时打开；Windows/macOS 通常要管理员权限）
# 只用系统代理（浏览器插件 / 系统代理）的话，这一段保持注释即可
# tun:
#   enable: true
#   stack: mixed                 # system / gvisor / mixed，建议 mixed
#   dns-hijack:
#     - any:53
#   auto-route: true
#   auto-redirect: false
#   auto-detect-interface: true
#   strict-route: true

# ----------------------------- 内核行为 -------------------------------------
profile:
  store-selected: true           # 记住手动选择的节点
  store-fake-ip: true            # 记住 fake-ip 映射，重启不掉线

# 域名嗅探：让纯 IP 连接也能按域名匹配规则（AI / 流媒体 场景很关键）
sniffer:
  enable: true
  force-dns-mapping: false
  parse-pure-ip: false
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"

# ----------------------------- Geo 数据库 -----------------------------------
geodata-mode: true               # GEOIP / GEOSITE 走 .dat（分类比 mmdb 更全）
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

# ----------------------------- DNS ------------------------------------------
# 为什么这样写：
#   * fake-ip：客户端拿到 198.18.x.x，域名信息保留给规则匹配，分流准确；
#   * 国内域名 -> 国内 DoH（快，不绕路）；
#   * 国外域名 -> Cloudflare / Google 加密 DoH（运营商看不到查询内容）；
#   * 代理服务器域名 -> proxy-server-nameserver，避免“解析依赖代理”的死循环；
#   * 不用 fallback + fallback-filter 老方案，改用 nameserver-policy 精确分流，
#     杜绝“国内域名问国外 DNS / 国外域名问国内 DNS”带来的污染和泄漏。
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  prefer-h3: false
  respect-rules: false
  use-hosts: true
  use-system-hosts: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  # 这些域名必须拿真实 IP（局域网、NTP、游戏机 NAT、系统连通性探测等）
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.home.arpa"
    - "localhost.ptlogin2.qq.com"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    - "+.market.xiaomi.com"
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "xnotify.xboxlive.com"
    - "*.battlenet.com.cn"
    - "*.blizzard.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "stun.*"
    - "*.wpad"
    - "*.workgroup"
  # 内核启动时用它先把 DoH 域名解析成 IP
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 180.76.76.76
  # 默认解析器（主要服务国内域名）
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  # 专门解析代理服务器域名，防止 DNS 死循环
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - 223.5.5.5
  # 精确按域名分流解析，避免 DNS 泄漏（依赖 geosite.dat，已开启 geodata-mode）
  nameserver-policy:
    "geosite:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:private":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    # 国外域名：优先国外加密 DoH；被运营商阻断时（实测 1.1.1.1/8.8.8.8 在国内
    # 很多线路直连超时）由下面的国内 DoH 兜底。列表是并发请求、谁先返回用谁，
    # 因此不会因为前两个不通而卡住解析。
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - tls://8.8.4.4:853
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

# ----------------------------- 订阅节点 -------------------------------------
# 所有节点由订阅动态导入，不写任何节点名。
# 多份订阅时：复制一份 provider2，再把各组的 use 改成 [provider1, provider2]。
proxy-providers:
  provider1:
    type: http
    # ★★★ 换成你自己的订阅链接 ★★★
    url: "https://bsub.douyincdns.com/2cad2128/5d113b9c-7861-4be7-a0ea-a5b24a515f77/zyknQkobN01dTPIs?x=48fd675a68e4&sub=clash&clash=1"
    path: ./providers/provider1.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 3000
      lazy: true
    # 过滤掉“剩余流量 / 到期时间 / 官网 / 试用”之类的信息节点
    exclude-filter: "(?i)(剩余|流量|到期|过期|续费|官网|订阅|网址|邀请|试用|通知|Traffic|Expire|Website|Renew)"
    # ★★★ 不要在这里写 skip-cert-verify: false ★★★
    # 该订阅的节点都是 anytls + 自签证书（SNI 是 www.bing.com，证书 CN=bing.com 自签），
    # 订阅里本来带 skip-cert-verify: true；一旦被 override 覆盖成 false，
    # 每个节点都会报 “failed to create session: tls: failed to verify certificate”，
    # 表现就是延迟测速全部超时、所有网站打不开。
    override:
      udp: true

  # ===== 第二个机场订阅（iKuuu）=====
  provider2:
    type: http
    url: "https://d30or.no-mad-world.club/link/tKTxA1SJFKSeRn9w?clash=3&extend=1"
    path: ./providers/provider2.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 3000
      lazy: true
    exclude-filter: "(?i)(剩余|流量|到期|过期|续费|官网|订阅|网址|邀请|试用|通知|Traffic|Expire|Website|Renew)"
    override:
      udp: true

# ----------------------------- 策略组 ---------------------------------------
proxy-groups:
  # ===== ♻️ 自动测速：两个订阅的全部节点一起测速，自动使用延迟最低的那台 =====
  #   · 想手动锁国家：在「🐟 漏网之鱼」或各个应用组里切换
  #   · 想手动锁某一台具体节点：用「🎯 手动选节点」
  - name: "♻️ 自动测速"
    type: url-test
    use: [provider1, provider2]
    url: https://cp.cloudflare.com/generate_204
    interval: 180                # 3 分钟重测一次
    tolerance: 50                # 新节点比当前快 50ms 以上才切换，避免抖动
    timeout: 3000
    max-failed-times: 3
    expected-status: 204
    lazy: true

  # ===== 手动指定单台节点：把两个订阅的节点摊平成一个列表，方便精确点选 =====
  - name: "🎯 手动选节点"
    type: select
    use: [provider1, provider2]

  # ===== 分应用策略组：既能选「♻️ 自动测速」，也能手动指定国家 =====

  # ChatGPT / Claude / Gemini / Grok / Perplexity / Copilot ...
  - name: "🤖 AI服务"
    type: select
    proxies:
      - "♻️ 自动测速"          # ← 默认；若 ChatGPT/Claude 提示地区不支持，切到 美国/日本/新加坡
      - "🇺🇸 美国节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇰🇷 韩国节点"
      - "台湾节点"
      - "🌍 其他地区"
      - DIRECT

  # Google 搜索 / Gmail / Google Play / Google Drive ...
  - name: "📢 Google"
    type: select
    proxies:
      - "♻️ 自动测速"          # ← 默认
      - "🇭🇰 香港节点"
      - "台湾节点"
      - "🇯🇵 日本节点"
      - "🇰🇷 韩国节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🌍 其他地区"
      - DIRECT

  # Netflix / Disney+ / YouTube / HBO Max / Prime Video / Spotify ...
  # 想看哪个区的内容，就手动切到对应国家组
  - name: "🎬 流媒体"
    type: select
    proxies:
      - "♻️ 自动测速"          # ← 默认
      - "🇺🇸 美国节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇭🇰 香港节点"
      - "台湾节点"
      - "🇰🇷 韩国节点"
      - "🌍 其他地区"
      - DIRECT

  # Microsoft / Office 365 / OneDrive / Outlook / Xbox / Azure / Bing ...
  - name: "🏢 Microsoft"
    type: select
    proxies:
      - "♻️ 自动测速"          # ← 默认
      - "🇺🇸 美国节点"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "台湾节点"
      - "🌍 其他地区"
      - DIRECT

  # Binance / OKX / Coinbase / Bybit / Gate / 行情与链上工具 ...
  # 提示：Binance 屏蔽美国 IP，建议手动切 日本 / 新加坡 / 香港；
  #      Coinbase 反而需要美国节点。
  - name: "₿ 加密货币"
    type: select
    proxies:
      - "♻️ 自动测速"          # ← 默认
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇭🇰 香港节点"
      - "🇺🇸 美国节点"
      - "🇰🇷 韩国节点"
      - "台湾节点"
      - "🌍 其他地区"
      - DIRECT

  # ===== 未命中任何规则的流量（国外网站默认走这里） =====
  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "♻️ 自动测速"          # ← 默认
      - "🎯 手动选节点"
      - "🇭🇰 香港节点"
      - "台湾节点"
      - "🇯🇵 日本节点"
      - "🇰🇷 韩国节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🌍 其他地区"
      - DIRECT

  # ===== 广告拦截（不想拦截就切成 DIRECT，或删掉本组与对应规则） =====
  - name: "🛑 广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  # ===== 各国/地区组：从订阅里按节点名自动筛选 + 自动测速 =====
  - name: "🇭🇰 香港节点"
    type: url-test
    use: [provider1, provider2]
    filter: '(?i)(香港|港区|港島|Hong ?Kong|HongKong|HKG|\bHK\b|🇭🇰)'
    url: https://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 50
    timeout: 3000
    max-failed-times: 3
    expected-status: 204
    lazy: true

  - name: "台湾节点"
    type: url-test
    use: [provider1, provider2]
    # \x{...} 是内核支持的 Unicode 转义，用于匹配节点名里的台湾旗标
    filter: '(?i)(台湾|台灣|台北|新北|桃园|彰化|Taiwan|Taipei|\bTW\b|TWN|\x{1F1F9}\x{1F1FC})'
    url: https://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 50
    timeout: 3000
    max-failed-times: 3
    expected-status: 204
    lazy: true

  - name: "🇯🇵 日本节点"
    type: url-test
    use: [provider1, provider2]
    filter: '(?i)(日本|东京|大阪|埼玉|Tokyo|Osaka|Japan|\bJP\b|JPN|🇯🇵)'
    url: https://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 50
    timeout: 3000
    max-failed-times: 3
    expected-status: 204
    lazy: true

  - name: "🇰🇷 韩国节点"
    type: url-test
    use: [provider1, provider2]
    filter: '(?i)(韩国|韓國|首尔|首爾|Korea|Seoul|\bKR\b|KOR|🇰🇷)'
    url: https://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 50
    timeout: 3000
    max-failed-times: 3
    expected-status: 204
    lazy: true

  - name: "🇸🇬 新加坡节点"
    type: url-test
    use: [provider1, provider2]
    filter: '(?i)(新加坡|狮城|獅城|Singapore|\bSG\b|SGP|🇸🇬)'
    url: https://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 50
    timeout: 3000
    max-failed-times: 3
    expected-status: 204
    lazy: true

  - name: "🇺🇸 美国节点"
    type: url-test
    use: [provider1, provider2]
    filter: '(?i)(美国|美國|洛杉矶|洛杉磯|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|达拉斯|硅谷|凤凰城|拉斯维加斯|United ?States|America|Los ?Angeles|San ?Jose|San ?Francisco|Seattle|Chicago|New ?York|Dallas|Silicon ?Valley|Phoenix|\bUS\b|USA|US-|🇺🇸)'
    url: https://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 50
    timeout: 3000
    max-failed-times: 3
    expected-status: 204
    lazy: true

  # 香港 / 美国 / 日本 / 台湾 / 韩国 / 新加坡 以外的节点全部归到这里
  # （英国、德国、法国、加拿大、澳大利亚、马来西亚、印度、土耳其……）
  - name: "🌍 其他地区"
    type: url-test
    use: [provider1, provider2]
    exclude-filter: '(?i)(香港|港区|港島|Hong ?Kong|HongKong|HKG|\bHK\b|🇭🇰|台湾|台灣|台北|新北|桃园|彰化|Taiwan|Taipei|\bTW\b|TWN|\x{1F1F9}\x{1F1FC}|日本|东京|大阪|埼玉|Tokyo|Osaka|Japan|\bJP\b|JPN|🇯🇵|韩国|韓國|首尔|首爾|Korea|Seoul|\bKR\b|KOR|🇰🇷|新加坡|狮城|獅城|Singapore|\bSG\b|SGP|🇸🇬|美国|美國|洛杉矶|洛杉磯|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|达拉斯|硅谷|凤凰城|拉斯维加斯|United ?States|America|Los ?Angeles|San ?Jose|San ?Francisco|Seattle|Chicago|New ?York|Dallas|Silicon ?Valley|Phoenix|\bUS\b|USA|US-|🇺🇸)'
    url: https://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 50
    timeout: 3000
    max-failed-times: 3
    expected-status: 204
    lazy: true

# ----------------------------- 规则 -----------------------------------------
# 匹配顺序 = 从上到下，第一条命中即生效，所以顺序很关键：
#   局域网直连 -> 广告拦截 -> AI -> Google -> 流媒体 -> Microsoft -> 加密货币
#   -> 国内直连 -> 兜底走代理
rules:
  # ===== A. 局域网 / 保留地址 / 系统连通性探测：直连 =====
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,localdomain,DIRECT
  - DOMAIN-SUFFIX,home.arpa,DIRECT
  - DOMAIN-SUFFIX,msftconnecttest.com,DIRECT
  - DOMAIN-SUFFIX,msftncsi.com,DIRECT
  - DOMAIN,connectivitycheck.gstatic.com,DIRECT
  - DOMAIN,connectivitycheck.android.com,DIRECT
  - DOMAIN,connectivitycheck.platform.hicloud.com,DIRECT
  - DOMAIN,www.qualcomm.cn,DIRECT
  - IP-CIDR,0.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.0.0.0/24,DIRECT,no-resolve
  - IP-CIDR,192.0.2.0/24,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,198.51.100.0/24,DIRECT,no-resolve
  - IP-CIDR,203.0.113.0/24,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR,240.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR,255.255.255.255/32,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
